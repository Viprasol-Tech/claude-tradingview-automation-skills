name: Bug or wrong fact
description: A skill gave wrong code, a wrong fact, or a script failed
labels: [bug]
body:
  - type: dropdown
    id: skill
    attributes:
      label: Skill
      options: [tv-alert-design, webhook-receiver, signal-to-order, indian-broker-apis, crypto-mt5-bridges, tradingview-charts, other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you asked, what you got, and what was wrong. Paste error messages exactly; remove any secrets.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What is correct
      description: Link to the official documentation if it is a platform fact.
  - type: input
    id: version
    attributes:
      label: Plugin version and Claude Code version
      placeholder: "tradingview-automation 1.0.0, Claude Code 2.x"
